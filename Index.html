.hero .w{padding-bottom:48px}.hero h1{font-size:clamp(2.4rem,9vw,4.8rem);font-weight:900;line-height:1;margin:.3em 0}.hero p{max-width:620px;color:#e8eef3}
.chip{display:inline-block;background:rgba(255,255,255,.18);padding:3px 12px;border-radius:99px;font-size:.85rem}
.b{display:inline-block;background:var(--pri);color:var(--pf);border:0;border-radius:10px;padding:10px 16px;font:600 1rem inherit;cursor:pointer;text-decoration:none;margin:4px 4px 4px 0}.b.o{background:none;border:2px solid currentColor;color:inherit}.b.s{padding:4px 10px;font-size:.85rem}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:var(--gl);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--gb);border-radius:14px;padding:16px}
.stat{font-size:1.6rem;font-weight:700}label{display:block;margin:8px 0;font-size:.9rem;color:var(--m)}
input,select,textarea{width:100%;padding:9px;border-radius:8px;border:1px solid var(--b);background:var(--bg);color:var(--fg);font:inherit;margin-top:3px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b);font-size:.92rem}
.t{padding:2px 8px;border-radius:99px;font-size:.78rem;font-weight:600}.ok{background:#d7f5e3;color:#0a5b2b}.no{background:#fde0e0;color:#8f1313}.wa{background:#fff0c9;color:#7a5200}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}#modal[hidden]{display:none}#modal .card{max-width:420px;width:100%}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;display:none;max-width:90%}
#cb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0));z-index:15}#cw{position:fixed;right:14px;bottom:calc(70px + env(safe-area-inset-bottom,0));width:min(340px,92vw);z-index:15;display:none}#cl{height:200px;overflow:auto;font-size:.9rem}
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:calc(100vh - 56px)}.auth .hero.ap{min-height:100%;align-items:flex-end}.ap h2{font-size:clamp(1.6rem,4vw,2.4rem);margin:.3em 0}.ap ul{padding-left:0;list-style:none;color:#e8eef3}.ap li{margin:6px 0}
.fp{display:flex;align-items:center;justify-content:center;padding:24px 16px}.fp .card{width:100%;max-width:420px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.18)}.fp h1{font-size:1.5rem;margin:.6em 0 .2em}
.seg{display:flex;background:var(--bg);border:1px solid var(--b);border-radius:12px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:none;color:var(--fg);padding:8px 4px;border-radius:9px;font:600 .9rem inherit;cursor:pointer}.seg .on{background:var(--pri);color:var(--pf)}
.pw{display:flex;gap:6px;align-items:center}.pw input{margin-top:0}.fp .b{width:100%;margin:10px 0 0;text-align:center}.fp .b.s{width:auto;margin:2px}
@media(max-width:760px){.auth{grid-template-columns:1fr}.auth .hero.ap{min-height:260px}}
.sk{display:grid;grid-template-columns:90px 1fr 44px;gap:10px;align-items:center;margin:8px 0}.bar{height:10px;background:var(--bg);border:1px solid var(--b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}.tg{display:flex;flex-wrap:wrap;gap:8px}.tg span{border:1px solid var(--pri);border-radius:99px;padding:4px 12px}.price{font-size:1.5rem;font-weight:700;color:var(--pri)}

let M,OPEN=0,tt;const L=()=>M&&(M.role=='landlord'?M.id:M.lid),LD=()=>S.u.find(u=>u.id==L()),ok=()=>{const l=LD();return l&&l.reg&&l.paid>=td()};

const log=t=>{S.au.unshift({t,d:new Date().toLocaleString(),u:M?M.name:'-',l:L()||0})};
const note=(to,txt)=>S.nt.unshift({id:++S.id,to,lid:L()||M.lid,txt,d:td()});
const chk=()=>{if(M.role=='staff'&&M.perm!='full')throw Error('Your staff permission is view-only');if(!ok())throw Error('Subscription inactive. Pay on the Billing page.')};
const bal=t=>{const n=new Date(),en=new Date(t.entry),m=(n.getFullYear()-en.getFullYear())*12+n.getMonth()-en.getMonth()+1;return Math.max(m,0)*t.rent-S.pay.filter(p=>p.tid==t.id).reduce((a,p)=>a+p.amt,0)};

const A={

portal:()=>{const t=M,mine=S.pay.filter(p=>p.tid==t.id),ns=S.nt.filter(n=>n.to==t.id||(n.to=='all'&&n.lid==t.lid)),d=t.d||{};return `<div class="w"><h1>Hello, ${e(t.name)}</h1><div class="g"><div class="card"><div class="m">Rent balance · Unit ${e(t.unit)}</div><div class="stat">${f(bal(t))}</div><p>${bal(t)>0?tag('no','Pay within '+days(t)+' days'):tag('ok','Paid up')}</p></div><div class="card"><h3>🔔 Notifications (${ns.length})</h3>${ns.slice(0,6).map(n=>`<p class="m">${n.d}: ${e(n.txt)} <a href="mailto:${e(t.email)}?subject=De-Tech notice&body=${encodeURIComponent(n.txt)}" aria-label="Email this notice">✉</a></p>`).join('')||'<p class="m">None</p>'}</div></div><h2>My receipts</h2><div class="card tw"><table>${mine.map(p=>`<tr><td>${p.d}</td><td>${f(p.amt)}</td><td><a href="#receipt/${p.id}">Download</a></td></tr>`).join('')||'<tr><td>No payments yet</td></tr>'}</table></div><div class="g"><div class="card"><h3>Report a repair</h3>${mk('rep','<label>What needs fixing?<textarea name="txt" required></textarea></label>','Submit')}${S.rq.filter(r=>r.tid==t.id).map(r=>`<p class="m">${r.d} ${e(r.txt)} ${tag(r.s=='Done'?'ok':'wa',r.s)}</p>`).join('')}</div><div class="card"><h3>My details</h3><form onsubmit="return F(event,'prof')">${[['id1','ID front','type=file accept=image/*'],['id2','ID back','type=file accept=image/*'],['in','Date entered house','type=date'],['out','Date leaving','type=date'],['father','Father full name'],['fphone','Father phone'],['mother','Mother full name'],['mphone','Mother phone'],['health','Illness / health status'],['county','County of residence'],['birth','Place of birth'],['home','Home town'],['school','Nearby school']].map(a=>inp(a[0],a[1],(a[2]||'')+(d[a[0]]&&!/file/.test(a[2]||'')?' value="'+e(d[a[0]])+'"':''))).join('')}<label>People in room (1-2)<select name="ppl"><option>1</option><option ${d.ppl==2?'selected':''}>2</option></select></label><button class="b">Save details</button></form></div></div></div>`}};
